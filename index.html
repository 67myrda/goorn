const CAL_SCOPE='https://www.googleapis.com/auth/calendar.events';
const CAL_BASE='https://www.googleapis.com/calendar/v3/calendars/primary/events';
const addHour=t=>{const[h,m]=t.split(':').map(Number);return `${String((h+1)%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;};
const makeCalEvent=order=>{
  const proc=procById[order.processStatus]||PROC[0];
  const hasTime=!!order.visitTime;
  return{
    summary:`GOORN: ${order.name} – ${order.city}`,
    description:['Prezentace přístroje osmotického odvlhčování zdiva',`Status: ${proc.label}`,order.notes?`Poznámka: ${order.notes}`:''].filter(Boolean).join('\n'),
    start:hasTime?{dateTime:`${order.visitDate}T${order.visitTime}:00`,timeZone:'Europe/Prague'}:{date:order.visitDate},
    end:hasTime?{dateTime:`${order.visitDate}T${addHour(order.visitTime)}:00`,timeZone:'Europe/Prague'}:{date:order.visitDate},
    colorId:'2',
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:1440},{method:'popup',minutes:120},{method:'popup',minutes:30}]},
  };
};
const calApi={
  create:async(order,token)=>{
    const r=await fetch(CAL_BASE,{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(makeCalEvent(order))});
    if(r.status===401)return{error:'auth'};return r.json();
  },
  update:async(eventId,order,token)=>{
    const r=await fetch(`${CAL_BASE}/${eventId}`,{method:'PUT',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(makeCalEvent(order))});
    if(r.status===401)return{error:'auth'};if(r.status===404)return{error:'notfound'};return r.json();
  },
  del:async(eventId,token)=>{
    const r=await fetch(`${CAL_BASE}/${eventId}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}});
    if(r.status===401)return{error:'auth'};return{ok:true};
  },
};
