<div id="loading" style="min-height:100vh;background:#EDEAE2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:Inter,sans-serif;">
  <div style="width:44px;height:44px;border-radius:10px;background:#487A4C;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;">GO</div>

</div>
<div id="root" style="display:none"></div>
<div id="error-box" style="display:none;min-height:100vh;background:#EDEAE2;align-items:center;justify-content:center;padding:24px;font-family:Inter,sans-serif;">
  <div style="background:#FAF7F2;border:1px solid #D8D0BE;border-radius:12px;padding:24px;max-width:400px;width:100%">
    <div style="font-weight:800;color:#B45252;margin-bottom:8px;">Chyba při načítání</div>
    <div id="error-msg" style="font-size:12px;color:#685E52;line-height:1.6;word-break:break-all;"></div>
    <button onclick="location.reload()" style="margin-top:14px;padding:8px 16px;background:#487A4C;color:#fff;border:none;border-radius:7px;font-size:13px;cursor:pointer;">Obnovit stránku</button>
  </div>
</div>
<script>
window.onerror=function(msg,src,line,col,err){
  document.getElementById('loading').style.display='none';
  var eb=document.getElementById('error-box');
  eb.style.display='flex';
  document.getElementById('error-msg').textContent=(err?err.toString():msg)+' ('+src+':'+line+')';
  return false;
};
</script>
