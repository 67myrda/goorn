<script>
window.onerror=function(msg,src,line,col,err){
  document.getElementById('loading').style.display='none';
  var eb=document.getElementById('error-box');
  eb.style.display='flex';
  document.getElementById('error-msg').textContent=(err?err.toString():msg)+' ('+src+':'+line+')';
  return false;
};
</script>

const CAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
const CAL_BASE = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
const addHour = t => {
  const [h, m] = t.split(':').map(Number);
  return `${String((h + 1) % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
};
const makeCalEvent = order => {
  const proc = procById[order.processStatus] || PROC[0];
  const hasTime = !!order.visitTime;
  return {
    summary: `GOORN: ${order.name} – ${order.city}`,
    description: ['Prezentace přístroje osmotického odvlhčování zdiva', `Status: ${proc.label}`, order.notes ? `Poznámka: ${order.notes}` : ''].filter(Boolean).join('\n'),
    start: hasTime ? {
      dateTime: `${order.visitDate}T${order.visitTime}:00`,
      timeZone: 'Europe/Prague'
    } : {
      date: order.visitDate
    },
    end: hasTime ? {
      dateTime: `${order.visitDate}T${addHour(order.visitTime)}:00`,
      timeZone: 'Europe/Prague'
    } : {
      date: order.visitDate
    },
    colorId: '2',
    reminders: {
      useDefault: false,
      overrides: [{
        method: 'popup',
        minutes: 1440
      }, {
        method: 'popup',
        minutes: 120
      }, {
        method: 'popup',
        minutes: 30
      }]
    }
  };
};
const calApi = {
  create: async (order, token) => {
    const r = await fetch(CAL_BASE, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(makeCalEvent(order))
    });
    if (r.status === 401) return {
      error: 'auth'
    };
    return r.json();
  },
  update: async (eventId, order, token) => {
    const r = await fetch(`${CAL_BASE}/${eventId}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(makeCalEvent(order))
    });
    if (r.status === 401) return {
      error: 'auth'
    };
    if (r.status === 404) return {
      error: 'notfound'
    };
    return r.json();
  },
  del: async (eventId, token) => {
    const r = await fetch(`${CAL_BASE}/${eventId}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    if (r.status === 401) return {
      error: 'auth'
    };
    return {
      ok: true
    };
  }
};

// ─── FIREBASE DATA LAYER ──────────────────────────────────────────────────────
function useOrders(userId) {
  const [orders, setOrders] = useState([]);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if (!userId) return;
    const ref = db.collection("users").doc(userId).collection("orders");
    const unsub = ref.onSnapshot(snap => {
      if (snap.empty && !ready) {
        // First login – import initial data
        const batch = db.batch();
        INITIAL_DATA.forEach(o => {
          const d = ref.doc(o.id);
          batch.set(d, o);
        });
        batch.commit().then(() => setReady(true));
      } else {
        setOrders(snap.docs.map(d => d.data()));
        setReady(true);
      }
    });
    return unsub;
  }, [userId]);
  const col = () => db.collection("users").doc(userId).collection("orders");
  const addOrder = o => col().doc(o.id).set(o);
  const updateOrder = o => col().doc(o.id).set(o, {
    merge: true
  });
  return {
    orders,
    ready,
    addOrder,
    updateOrder
  };
}

// ─── PDF EXPORT ───────────────────────────────────────────────────────────────
function exportPDF(orders, year) {
  const {
    jsPDF
  } = window.jspdf;
  const doc = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "a4"
  });
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text(`GOORN · Zakázky ${year}`, 14, 16);
  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");
  doc.setTextColor(120, 100, 80);
  doc.text(`Exportováno ${new Date().toLocaleDateString("cs-CZ")} · Pro GOORN © ⁶⁷〽️`, 14, 22);
  const yo = orders.filter(o => o.year === year).sort((a, b) => b.num - a.num);
  const rows = yo.map(o => {
    const p = procById[o.processStatus] || PROC[0];
    const f = finById[o.finStatus];
    const r = REAL.find(x => x.id === o.realStatus);
    return [o.num === 0 ? "XX" : String(o.num), o.name || "—", o.city || "—", fmtDate(o.visitDate, o.visitTime) || "—", p.label, r && r.id ? r.label : "—", f && f.id ? f.label : "—", o.notes || ""];
  });
  doc.autoTable({
    startY: 28,
    head: [["#", "Zákazník", "Město", "Datum", "Procesní status", "Instalace", "Provize", "Poznámky"]],
    body: rows,
    styles: {
      fontSize: 7.5,
      cellPadding: 2,
      font: "helvetica"
    },
    headStyles: {
      fillColor: [72, 122, 76],
      textColor: 255,
      fontStyle: "bold"
    },
    alternateRowStyles: {
      fillColor: [245, 240, 232]
    },
    columnStyles: {
      0: {
        cellWidth: 8
      },
      7: {
        cellWidth: 35
      }
    },
    margin: {
      left: 8,
      right: 8
    }
  });
  const total = yo.length;
  const real = yo.filter(o => o.processStatus === "real").length;
  const finalY = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(8);
  doc.setTextColor(80, 60, 40);
  doc.text(`Celkem: ${total}  |  Realizace: ${real}  |  Úspěšnost: ${total > 0 ? Math.round(real / total * 100) : 0} %`, 14, finalY);
  doc.save(`GOORN_${year}_zakazky.pdf`);
}
