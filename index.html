// ─── FIREBASE DATA LAYER ──────────────────────────────────────────────────────
function useOrders(userId){
  const[orders,setOrders]=useState([]);
  const[ready,setReady]=useState(false);

  useEffect(()=>{
    if(!userId)return;
    const ref=db.collection("users").doc(userId).collection("orders");
    const unsub=ref.onSnapshot(snap=>{
      if(snap.empty&&!ready){
        // First login – import initial data
        const batch=db.batch();
        INITIAL_DATA.forEach(o=>{const d=ref.doc(o.id);batch.set(d,o);});
        batch.commit().then(()=>setReady(true));
      } else {
        setOrders(snap.docs.map(d=>d.data()));
        setReady(true);
      }
    });
    return unsub;
  },[userId]);

  const col=()=>db.collection("users").doc(userId).collection("orders");

  const addOrder=o=>col().doc(o.id).set(o);
  const updateOrder=o=>col().doc(o.id).set(o,{merge:true});

  return{orders,ready,addOrder,updateOrder};
}

// ─── PDF EXPORT ───────────────────────────────────────────────────────────────
function exportPDF(orders,year){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  doc.setFont("helvetica","bold");
  doc.setFontSize(16);
  doc.text(`GOORN · Zakázky ${year}`,14,16);
  doc.setFontSize(9);
  doc.setFont("helvetica","normal");
  doc.setTextColor(120,100,80);
  doc.text(`Exportováno ${new Date().toLocaleDateString("cs-CZ")} · Pro GOORN © ⁶⁷〽️`,14,22);

  const yo=orders.filter(o=>o.year===year).sort((a,b)=>b.num-a.num);
  const rows=yo.map(o=>{
    const p=procById[o.processStatus]||PROC[0];
    const f=finById[o.finStatus];
    const r=REAL.find(x=>x.id===o.realStatus);
    return[
      o.num===0?"XX":String(o.num),
      o.name||"—",
      o.city||"—",
      fmtDate(o.visitDate,o.visitTime)||"—",
      p.label,
      r&&r.id?r.label:"—",
      f&&f.id?f.label:"—",
      o.notes||""
    ];
  });

  doc.autoTable({
    startY:28,
    head:[["#","Zákazník","Město","Datum","Procesní status","Instalace","Provize","Poznámky"]],
    body:rows,
    styles:{fontSize:7.5,cellPadding:2,font:"helvetica"},
    headStyles:{fillColor:[72,122,76],textColor:255,fontStyle:"bold"},
    alternateRowStyles:{fillColor:[245,240,232]},
    columnStyles:{0:{cellWidth:8},7:{cellWidth:35}},
    margin:{left:8,right:8},
  });

  const total=yo.length;
  const real=yo.filter(o=>o.processStatus==="real").length;
  const finalY=doc.lastAutoTable.finalY+8;
  doc.setFontSize(8);
  doc.setTextColor(80,60,40);
  doc.text(`Celkem: ${total}  |  Realizace: ${real}  |  Úspěšnost: ${total>0?Math.round(real/total*100):0} %`,14,finalY);

  doc.save(`GOORN_${year}_zakazky.pdf`);
}

// ─── PROCESS STATUS PICKER ────────────────────────────────────────────────────
function ProcPicker({current,onChange,onClose}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(20,15,8,.45)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:400,padding:16}}
      onClick={onClose}>
      <div style={{background:C.surface,borderRadius:14,padding:18,width:"100%",maxWidth:340,
        boxShadow:"0 12px 40px rgba(0,0,0,.22)"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:11,fontWeight:700,color:C.textLight,textTransform:"uppercase",
          letterSpacing:".6px",marginBottom:12}}>Procesní status zakázky</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6}}>
          {PROC.map(s=>{
            const Icon=s.icon;const active=s.id===current;
            return(
              <button key={s.id} onClick={()=>{onChange(s.id);onClose();}}
                style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",
                  borderRadius:8,cursor:"pointer",background:active?s.pale:C.surfaceAlt,
                  border:`1.5px solid ${active?s.color:C.borderLight}`,
                  color:active?s.color:C.textMid,fontWeight:active?700:500,fontSize:12,textAlign:"left"}}>
                <div style={{width:26,height:26,borderRadius:6,background:`${s.color}28`,
                  display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <Icon size={13} color={s.color} strokeWidth={2}/>
                </div>
                {s.label}
                {active&&<Check size={11} color={s.color} style={{marginLeft:"auto"}}/>}
              </button>
            );
          })}
        </div>
        <button onClick={onClose} style={{width:"100%",marginTop:10,padding:"9px",borderRadius:8,
          border:`1px solid ${C.border}`,background:C.surfaceAlt,color:C.textMid,
          fontSize:12,fontWeight:600,cursor:"pointer"}}>Zavřít</button>
      </div>
    </div>
  );
}

// ─── CYCLE BUTTON ─────────────────────────────────────────────────────────────
function CycleBtn({statuses,value,onChange,size=28}){
  const[tip,setTip]=useState(false);
  const idx=statuses.findIndex(s=>s.id===value);
  const cur=statuses[Math.max(0,idx)];
  const Icon=cur.icon;
  const click=e=>{
    e.stopPropagation();
    onChange(statuses[(idx+1)%statuses.length].id);
    setTip(true);setTimeout(()=>setTip(false),1400);
  };
  return(
    <div style={{position:"relative",flexShrink:0}}>
      <button onClick={click} title={cur.label}
        style={{width:size,height:size,borderRadius:6,background:cur.pale,
          border:`1.5px solid ${cur.color}55`,display:"flex",alignItems:"center",
          justifyContent:"center",cursor:"pointer",transition:"box-shadow .1s"}}
        onMouseEnter={e=>e.currentTarget.style.boxShadow=`0 2px 8px ${cur.color}40`}
        onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
        {Icon?<Icon size={size*.43} color={cur.color} strokeWidth={2}/>
          :<span style={{color:C.textLight,fontSize:9,fontWeight:700}}>—</span>}
      </button>
      {tip&&<div style={{position:"absolute",bottom:"115%",left:"50%",
        transform:"translateX(-50%)",background:C.text,color:"#fff",borderRadius:6,
        padding:"3px 8px",fontSize:10,fontWeight:600,whiteSpace:"nowrap",
        zIndex:500,pointerEvents:"none"}}>{cur.label}</div>}
    </div>
  );
}

// ─── STATUS TILE ─────────────────────────────────────────────────────────────
function Tile({status,count,active,onClick}){
  const Icon=status.icon;
  return(
    <button onClick={onClick}
      style={{flex:1,minWidth:70,maxWidth:90,background:active?status.pale:C.surface,
        border:`1.5px solid ${active?status.color:C.border}`,borderRadius:10,
        padding:"8px 4px 7px",cursor:"pointer",display:"flex",flexDirection:"column",
        alignItems:"center",gap:3,boxShadow:active?`0 0 0 2px ${status.color}30`:"none",
        transition:"all .15s"}}>
      <div style={{width:30,height:30,borderRadius:7,background:`${status.color}38`,
        display:"flex",alignItems:"center",justifyContent:"center"}}>
        <Icon size={15} color={status.color} strokeWidth={2}/>
      </div>
      <div style={{fontSize:19,fontWeight:800,color:active?status.color:C.text,lineHeight:1}}>{count}</div>
      <div style={{fontSize:8,color:active?status.color:C.textLight,textAlign:"center",
        lineHeight:1.25,fontWeight:active?700:500,padding:"0 2px"}}>{status.label}</div>
    </button>
  );
}

// ─── ORDER ROW ────────────────────────────────────────────────────────────────

// ─── ADD ORDER MODAL ──────────────────────────────────────────────────────────

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({orders,year,filter,onFilter}){
  const yo=orders.filter(o=>o.year===year);
  const total=yo.length;
  const real=yo.filter(o=>o.processStatus==="real").length;
  const actv=yo.filter(o=>!["done","cancelled","cancelledR"].includes(o.processStatus)).length;
  const procC=Object.fromEntries(PROC.map(s=>[s.id,yo.filter(o=>o.processStatus===s.id).length]));
  const finC=Object.fromEntries(FIN.slice(1).map(s=>[s.id,orders.filter(o=>o.finStatus===s.id).length]));
  return(
    <div style={{padding:18,display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {[
          {label:"Celkem",   value:total,   color:C.brown},
          {label:"Aktivní",  value:actv,    color:C.orange},
          {label:"Realizace",value:real,    color:C.greenBright},
          ...(total>0?[{label:"Úspěšnost",value:`${Math.round(real/total*100)} %`,color:C.greenBright}]:[]),
        ].map(({label,value,color})=>(
          <div key={label} style={{flex:1,minWidth:80,background:C.surface,
            border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:9,color:C.textLight,fontWeight:700,textTransform:"uppercase",
              letterSpacing:".5px",marginBottom:2}}>{label}</div>
            <div style={{fontSize:22,fontWeight:800,color,lineHeight:1}}>{value}</div>
          </div>
        ))}
      </div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:12}}>
        <div style={{fontSize:9,fontWeight:700,color:C.textLight,textTransform:"uppercase",
          letterSpacing:".6px",marginBottom:10}}>Procesní statusy · {year}</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {PROC.map(s=><Tile key={s.id} status={s} count={procC[s.id]||0}
            active={filter===s.id} onClick={()=>onFilter(filter===s.id?null:s.id)}/>)}
        </div>
      </div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:12}}>
        <div style={{fontSize:9,fontWeight:700,color:C.textLight,textTransform:"uppercase",
          letterSpacing:".6px",marginBottom:10}}>
          Finanční přehled · <span style={{color:C.orange}}>všechny roky</span>
        </div>
        <div style={{display:"flex",gap:5}}>
          {FIN.slice(1).map(s=><Tile key={s.id} status={s} count={finC[s.id]||0}
            active={filter===`fin-${s.id}`}
            onClick={()=>onFilter(filter===`fin-${s.id}`?null:`fin-${s.id}`)}/>)}
        </div>
      </div>
    </div>
  );
}

// ─── ORDERS VIEW ─────────────────────────────────────────────────────────────
function OrdersView({orders,year,filter,onFilter,onUpdate,onAdd}){
  const[search,setSearch]=useState("");
  const[showAdd,setShowAdd]=useState(false);
  let list=orders.filter(o=>o.year===year);
  if(filter&&!filter.startsWith("fin-"))list=list.filter(o=>o.processStatus===filter);
  if(filter&&filter.startsWith("fin-"))list=list.filter(o=>o.finStatus===filter.replace("fin-",""));
  if(search.trim()){const q=search.toLowerCase();
    list=list.filter(o=>o.name?.toLowerCase().includes(q)||o.city?.toLowerCase().includes(q));}
  list=list.sort((a,b)=>b.num-a.num);
  const maxNum=Math.max(0,...orders.filter(o=>o.year===year).map(o=>o.num));
  const activeFilter=filter&&!filter.startsWith("fin-")?procById[filter]
    :filter?.startsWith("fin-")?finById[filter.replace("fin-","")]:null;
  return(
    <div id="print-area" style={{padding:18,display:"flex",flexDirection:"column",gap:12}}>
      <div className="no-print" style={{display:"flex",gap:8,alignItems:"center"}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:8,
          background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px"}}>
          <Search size={13} color={C.textLight}/>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Jméno nebo město…"
            style={{border:"none",background:"transparent",fontSize:13,color:C.text,
              outline:"none",flex:1,fontFamily:"inherit"}}/>
          {search&&<button onClick={()=>setSearch("")}
            style={{border:"none",background:"none",cursor:"pointer",color:C.textLight}}>
            <X size={12}/></button>}
        </div>
        <button onClick={()=>setShowAdd(true)}
          style={{display:"flex",alignItems:"center",gap:6,background:C.green,border:"none",
            borderRadius:8,padding:"9px 14px",color:"#fff",fontSize:13,fontWeight:700,
            cursor:"pointer",whiteSpace:"nowrap"}}><Plus size={14}/>Přidat</button>
      </div>
      {activeFilter&&(
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <StatusChip s={activeFilter}/>
          <button onClick={()=>onFilter(null)}
            style={{border:"none",background:"none",cursor:"pointer",color:C.textLight,
              display:"flex",alignItems:"center"}}><X size={12}/></button>
          <span style={{fontSize:11,color:C.textLight}}>{list.length} zakázek</span>
        </div>
      )}
      {list.length===0?(
        <div style={{padding:40,textAlign:"center",color:C.textLight,fontSize:13,
          background:C.surface,border:`1px solid ${C.border}`,borderRadius:10}}>
          {orders.filter(o=>o.year===year).length===0
            ?`Rok ${year} nemá žádné zakázky.`:"Žádné zakázky odpovídají filtru."}
        </div>
      ):(
        <div>{list.map(o=><OrderRow key={o.id} order={o} onUpdate={onUpdate}/>)}</div>
      )}
      {showAdd&&<AddModal year={year} maxNum={maxNum} onAdd={onAdd} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

// ─── STATISTICS ───────────────────────────────────────────────────────────────
function Stats({orders,year}){
  const yo=orders.filter(o=>o.year===year);
  const total=yo.length;
  if(total===0)return(
    <div style={{padding:32,textAlign:"center",color:C.textLight,fontSize:13}}>
      Rok {year} nemá žádná data.</div>
  );
  const real=yo.filter(o=>o.processStatus==="real").length;
  const cancelled=yo.filter(o=>o.processStatus==="cancelled"||o.processStatus==="cancelledR").length;
  const convRate=Math.round(real/total*100);
  const monthly={};
  yo.forEach(o=>{
    if(!o.visitDate)return;
    const m=new Date(o.visitDate+"T00:00:00").getMonth();
    if(!monthly[m])monthly[m]={total:0,real:0};
    monthly[m].total++;
    if(o.processStatus==="real")monthly[m].real++;
  });
  const mKeys=Object.keys(monthly).map(Number).sort((a,b)=>a-b);
  const maxM=Math.max(...mKeys.map(k=>monthly[k].total),1);
  const procData=PROC.map(s=>({...s,count:yo.filter(o=>o.processStatus===s.id).length}))
    .filter(s=>s.count>0).sort((a,b)=>b.count-a.count);
  const maxP=Math.max(...procData.map(s=>s.count),1);
  const card=(label,value,color,Icon)=>(
    <div style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
      padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:34,height:34,borderRadius:8,background:`${color}22`,
        display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        <Icon size={16} color={color} strokeWidth={2}/>
      </div>
      <div>
        <div style={{fontSize:9,color:C.textLight,fontWeight:700,textTransform:"uppercase",
          letterSpacing:".5px"}}>{label}</div>
        <div style={{fontSize:22,fontWeight:800,color,lineHeight:1.1}}>{value}</div>
      </div>
    </div>
  );
  return(
    <div id="print-area" style={{padding:18,display:"flex",flexDirection:"column",gap:14}}>
      <div style={{fontSize:13,fontWeight:800,color:C.text}}>Statistiky · {year}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {card("Celkem zakázek",total,C.brown,Target)}
        {card("Realizace",real,C.greenBright,CheckCircle2)}
        {card("Zrušeno",cancelled,C.danger,XCircle)}
        {card("Úspěšnost",`${convRate} %`,C.greenBright,TrendingUp)}
      </div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
        <div style={{fontSize:10,fontWeight:700,color:C.textLight,textTransform:"uppercase",
          letterSpacing:".6px",marginBottom:14}}>Distribuce statusů</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {procData.map(s=>{
            const Icon=s.icon;const pct=Math.round(s.count/maxP*100);
            return(
              <div key={s.id} style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:20,height:20,borderRadius:5,background:`${s.color}28`,
                  display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <Icon size={11} color={s.color} strokeWidth={2}/>
                </div>
                <div style={{fontSize:11,color:C.textMid,width:130,flexShrink:0}}>{s.label}</div>
                <div style={{flex:1,height:18,background:C.surfaceAlt,borderRadius:4,overflow:"hidden"}}>
                  <div style={{width:`${pct}%`,height:"100%",background:s.color,
                    borderRadius:4,opacity:.85}}/>
                </div>
                <div style={{width:28,textAlign:"right",fontSize:12,fontWeight:700,
                  color:s.color,flexShrink:0}}>{s.count}</div>
                <div style={{width:36,textAlign:"right",fontSize:10,color:C.textLight,
                  flexShrink:0}}>{Math.round(s.count/total*100)} %</div>
              </div>
            );
          })}
        </div>
      </div>
      {mKeys.length>0&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
          <div style={{fontSize:10,fontWeight:700,color:C.textLight,textTransform:"uppercase",
            letterSpacing:".6px",marginBottom:14}}>Měsíční aktivita · {year}</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:6,height:100}}>
            {mKeys.map(m=>{
              const d=monthly[m];
              const hT=Math.round(d.total/maxM*80)+10;
              const hR=Math.round(d.real/d.total*hT);
              return(
                <div key={m} style={{flex:1,display:"flex",flexDirection:"column",
                  alignItems:"center",gap:4}}>
                  <div style={{fontSize:10,fontWeight:700,color:C.textMid}}>{d.total}</div>
                  <div style={{width:"100%",height:hT,borderRadius:"5px 5px 0 0",
                    background:C.greenBrightPale,border:`1px solid ${C.greenBright}33`,
                    position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,
                      height:hR>0?`${Math.round(hR/hT*100)}%`:"0",
                      background:C.greenBright,opacity:.75}}/>
                  </div>
                  <div style={{fontSize:9,color:C.textLight}}>{MONTHS[m]}</div>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:12,marginTop:10}}>
            <div style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:C.textLight}}>
              <div style={{width:10,height:10,borderRadius:2,background:C.greenBrightPale,
                border:`1px solid ${C.greenBright}44`}}/>Celkem
            </div>
            <div style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:C.textLight}}>
              <div style={{width:10,height:10,borderRadius:2,background:C.greenBright,opacity:.75}}/>Realizace
            </div>
          </div>
        </div>
      )}
      {[year-1,year-2].some(y=>orders.some(o=>o.year===y))&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
          <div style={{fontSize:10,fontWeight:700,color:C.textLight,textTransform:"uppercase",
            letterSpacing:".6px",marginBottom:12}}>Porovnání roků</div>
          {[year-2,year-1,year].filter(y=>orders.some(o=>o.year===y)).map(y=>{
            const d=orders.filter(o=>o.year===y);
            const r=d.filter(o=>o.processStatus==="real").length;
            const t=d.length;const rate=t>0?Math.round(r/t*100):0;
            return(
              <div key={y} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <div style={{width:36,fontSize:11,fontWeight:700,color:C.text}}>{y}</div>
                <div style={{flex:1,height:20,background:C.surfaceAlt,borderRadius:4,overflow:"hidden"}}>
                  <div style={{width:`${rate}%`,height:"100%",background:C.greenBright,
                    borderRadius:4,opacity:.8}}/>
                </div>
                <div style={{fontSize:11,fontWeight:700,color:C.greenBright,width:40,textAlign:"right"}}>
                  {rate} %</div>
                <div style={{fontSize:10,color:C.textLight,width:60}}>{r}/{t} real.</div>
              </div>
            );
          })}
        </div>
      )}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
        <div style={{fontSize:10,fontWeight:700,color:C.textLight,textTransform:"uppercase",
          letterSpacing:".6px",marginBottom:14}}>
          Finanční stav · <span style={{color:C.orange}}>všechny roky</span>
        </div>
        <div style={{display:"flex",gap:10}}>
          {FIN.slice(1).map(s=>{
            const Icon=s.icon;const cnt=orders.filter(o=>o.finStatus===s.id).length;
            return(
              <div key={s.id} style={{flex:1,background:s.pale,border:`1px solid ${s.color}33`,
                borderRadius:10,padding:"12px",textAlign:"center"}}>
                <Icon size={18} color={s.color} strokeWidth={1.8}/>
                <div style={{fontSize:20,fontWeight:800,color:s.color,margin:"4px 0 2px"}}>{cnt}</div>
                <div style={{fontSize:9,color:s.color,fontWeight:600,lineHeight:1.3}}>{s.label}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

    border:`1px solid ${C.border}`,display:"flex",alignItems:"center",

    <div className="no-print"

        padding:"0 14px",gap:12,flexShrink:0}}>

          <button onClick={()=>onYear(1)} style={{width:22,height:22,borderRadius:11,
            border:"none",background:"transparent",display:"flex",alignItems:"center",
            justifyContent:"center",cursor:"pointer",color:C.textMid}}>
            <ChevronRight size={13}/></button>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>

  );

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[authError,setAuthError]=useState(null);
  const[year,setYear]=useState(2026);
  const[view,setView]=useState("dashboard");
  const[sidebar,setSidebar]=useState(true);
  const[filter,setFilter]=useState(null);

  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(u=>{setUser(u);setAuthLoading(false);});
    return unsub;
  },[]);

  const{orders,ready,addOrder,updateOrder}=useOrders(user?.uid);

  const signIn=()=>{
    setAuthError(null);
    const provider=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e=>setAuthError(e.message));
  };

  const handleFilter=f=>{setFilter(f);if(f!==null)setView("orders");};
  const handleNav=v=>{setView(v);if(v!=="orders")setFilter(null);};
  const shared={orders,year,filter,onFilter:handleFilter};

  if(authLoading)return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",
      justifyContent:"center"}}>
      <div style={{fontSize:14,color:C.textLight}}>Načítám…</div>
    </div>
  );

  if(!user)return <LoginScreen onLogin={signIn} error={authError}/>;

  if(!ready)return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",
      justifyContent:"center"}}>
      <div style={{fontSize:14,color:C.textLight}}>Synchronizuji data…</div>
    </div>
  );

  return(
    <>
      <div className="print-header">GOORN · Zakázky {year}</div>
      <div style={{fontFamily:"inherit",background:C.bg,minHeight:"100vh",
        display:"flex",flexDirection:"column",color:C.text}}>
        <Header year={year} onYear={d=>setYear(y=>y+d)} onMenu={()=>setSidebar(s=>!s)}
          user={user} orders={orders}/>
        <div style={{display:"flex",flex:1,overflow:"hidden",minHeight:"calc(100vh - 52px)"}}>
          <Sidebar active={view} onChange={handleNav} open={sidebar}/>
          <main style={{flex:1,overflowY:"auto"}}>
            {view==="dashboard"&&<Dashboard {...shared}/>}
            {view==="orders"   &&<OrdersView {...shared} onUpdate={updateOrder} onAdd={addOrder}/>}
            {view==="stats"    &&<Stats orders={orders} year={year}/>}
            {view==="settings" &&<SettingsView user={user}/>}
          </main>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
